<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Notebook</title>
<meta name="theme-color" content="#0b0b0c">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Notebook">
<link rel="preload" href="display-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Layout: black base, pastel blocks with big squircle corners, black type on colour; one phone column. */
@font-face{font-family:"Display";font-style:normal;font-weight:200 800;font-display:swap;src:url(display-latin-ext.woff2) format("woff2");unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Display";font-style:normal;font-weight:200 800;font-display:swap;src:url(display-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --bg:#0b0b0c; --surface:#19191b; --surface2:#242427; --line:#303034;
  --ink:#f4f2ee; --muted:#a3a1a8; --faint:#6f6d75; --on:#111111; --on-muted:rgba(17,17,17,.62);
  --yellow:#f2ec7a; --lav:#cfc7fa; --pink:#eec3da; --sky:#afc6e6; --orange:#ef7e52; --mint:#6fe3a0;
  --sage:#86b59b; --brown:#b88a77; --red:#ec5b33; --blue:#8aa3f2;
  --good:#6fe3a0; --again:#ec5b33;
  --f-display:"Display","Arial Black",-apple-system,BlinkMacSystemFont,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r-xl:30px; --r-lg:22px; --r-md:16px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.tile,.pillrow,.btn,.fab,.grade{transition:transform .12s ease}.tile:active,.pillrow:active,.btn:active,.fab:active,.grade:active{transform:scale(.97)}}

.wrap{max-width:600px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.wrap.home{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:12px;margin-bottom:6px;display:flex;align-items:center;gap:10px;min-height:56px}
.bar h1{font-family:var(--f-display);font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{border:0;background:var(--surface2);color:var(--ink);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;padding:0;flex:none}
.back svg{width:20px;height:20px}
.lead{color:var(--muted);margin:2px 0 0;font-size:15px}

/* home */
.home-head{padding-top:calc(20px + env(safe-area-inset-top,0px));margin-bottom:18px}
.dateline{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.home-title{font-family:var(--f-display);font-size:clamp(44px,13vw,60px);font-weight:800;letter-spacing:-.035em;line-height:.9;margin:0}
.hero{display:grid;grid-template-columns:1fr auto;align-items:end;gap:6px 12px;width:100%;border:0;text-align:left;border-radius:var(--r-xl);padding:18px 20px 20px;margin:0 0 12px;background:var(--red);color:var(--on)}
.hero.calm{background:var(--mint)}
.hero .lbl{grid-column:1/-1;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--on-muted)}
.hero .num{font-family:var(--f-display);font-weight:800;font-size:76px;line-height:.85;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:.95;letter-spacing:-.03em}
.hero .sub{display:block;font-size:15px;font-weight:600;margin-top:6px}
.hero .go{background:var(--mint);color:var(--on);border-radius:999px;padding:12px 20px;font-family:var(--f-display);font-weight:800;font-size:17px;white-space:nowrap}
.hero.calm .go{background:var(--on);color:var(--mint)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:var(--r-xl);padding:16px 16px 18px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:10px;aspect-ratio:1/1;min-width:0;color:var(--on)}
.tile .tt{display:block;font-size:19px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.tile .ts{display:block;font-size:13px;line-height:1.3;color:var(--on-muted);margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile .ic{width:48px;height:48px;display:block}
.tile.wide{grid-column:1/-1;aspect-ratio:auto;flex-direction:row;align-items:flex-end;min-height:150px}
.tile.wide .tt{font-family:var(--f-display);font-weight:800;font-size:40px;letter-spacing:-.03em;line-height:1}
.tile.wide .ts{font-size:14px;margin-top:8px;-webkit-line-clamp:3}
.tile.wide .ic{width:64px;height:64px;flex:none}.tile.wide .ic svg{width:64px;height:64px}
.tile .ic svg{width:48px;height:48px;display:block}
.c-yellow{background:var(--yellow)} .c-lav{background:var(--lav)} .c-mint{background:var(--mint)} .c-sky{background:var(--sky)}
.c-orange{background:var(--orange)} .c-pink{background:var(--pink)} .c-sage{background:var(--sage)} .c-brown{background:var(--brown)} .c-blue{background:var(--blue)}
.settings{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0}
.settings button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
.settings .on{color:var(--mint)}
.thoughts-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:34px 0 12px}
.thoughts-head h2{font-family:var(--f-display);font-weight:800;font-size:32px;letter-spacing:-.03em;margin:0;line-height:1}
.thoughts-head button{border:0;background:none;color:var(--muted);font-weight:600;font-size:14px;padding:4px 0}
.think-empty{border:1.5px dashed var(--line);border-radius:var(--r-lg);padding:20px;color:var(--muted);font-size:15px;text-align:center}

/* floating buttons */
.fabs{position:fixed;z-index:20;right:max(16px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:12px}
.fab{border:0;padding:0;border-radius:999px;display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.55),0 0 0 3px var(--bg)}
.fab.add{width:56px;height:56px;background:var(--yellow);color:var(--on)}
.fab.add svg{width:26px;height:26px}
.fab.think{width:66px;height:66px;background:var(--lav);color:var(--on);font-family:var(--f-display);font-weight:800;font-size:27px;letter-spacing:-.04em;line-height:1;padding-bottom:3px}
.thoughts-row{width:100%;border:0;border-radius:var(--r-xl);background:var(--lav);color:var(--on);text-align:left;margin-top:22px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.thoughts-row b{display:block;font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.03em;line-height:1.05}
.thoughts-row > span > span{display:block;font-size:14px;color:var(--on-muted);margin-top:4px}
.thoughts-row .cnt{font-family:var(--f-display);font-weight:800;font-size:40px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}

/* overlays (thought composer, quick add) */
.overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:600px;max-height:92%;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.panel-head{display:flex;align-items:center;gap:10px}
.panel-head h2{flex:1;margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1.1}
.round{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;padding:0;text-decoration:none;flex:none}
.round svg{width:18px;height:18px}

/* thought composer */
.composer{display:flex;flex-direction:column;gap:12px}
.composer textarea{border:0;resize:none;width:100%;min-height:110px;font-size:18px;line-height:1.45;padding:14px 16px;border-radius:var(--r-md);background:var(--surface2);color:var(--ink)}
.composer textarea:focus{outline:2px solid var(--line)}
.composer .tools{display:flex;align-items:center;gap:8px}
.composer .tools .sp{flex:1}
.ibtn{border:0;background:var(--surface2);border-radius:999px;height:42px;padding:0 16px;display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--ink)}
.ibtn svg{width:19px;height:19px}
.post{border:0;background:var(--mint);color:var(--on);border-radius:999px;height:42px;padding:0 22px;font-family:var(--f-display);font-weight:800;font-size:16px}
.post:disabled{opacity:.35}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.thumb{position:relative;width:76px;height:76px;border-radius:14px;overflow:hidden;background:var(--surface2);flex:none}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .rm{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:999px;border:0;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center;padding:0}
.thumb .rm svg{width:12px;height:12px}
.busy{font-size:13px;color:var(--muted)}

/* thought cards */
.note-card{border-radius:var(--r-lg);padding:16px 16px 18px;margin-bottom:10px;display:flex;flex-direction:column;gap:10px;color:var(--on)}
.note-card .when{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--on-muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.note-card .body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:18px;line-height:1.45;font-weight:500}
.note-card .mini{background:rgba(0,0,0,.08);border-color:rgba(0,0,0,.15);color:var(--on);text-transform:none;letter-spacing:0}
.note-card .mini.del{color:#9b2d10}
.note-card .mini.del.armed{background:var(--on);color:#fff}
.media{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.media.one{grid-template-columns:1fr}
.media .m{border-radius:14px;overflow:hidden;background:rgba(0,0,0,.1);aspect-ratio:1/1;border:0;padding:0;display:block;width:100%}
.media.one .m{aspect-ratio:auto;max-height:460px}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.media.one img{object-fit:contain;max-height:460px}
.media video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
.media .missing{display:grid;place-items:center;color:var(--on-muted);font-size:13px;padding:12px;text-align:center}
.note-edit{width:100%;border:0;border-radius:12px;padding:10px 12px;font-size:17px;min-height:100px;background:rgba(255,255,255,.55);color:var(--on)}
.viewer{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.94);display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 12px calc(20px + env(safe-area-inset-bottom,0px))}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));width:42px;height:42px;border-radius:999px;border:0;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center}
.viewer button svg{width:20px;height:20px}

/* shared */
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.t-kelime{background:var(--sky);color:var(--on)} .tag.t-kalip{background:var(--pink);color:var(--on)} .tag.t-chunk{background:var(--mint);color:var(--on)}
.tag.ok{background:var(--mint);color:var(--on)}
.btn{border:0;border-radius:999px;padding:14px 22px;background:var(--mint);color:var(--on);font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em}
.btn.light{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-family:var(--f-body);font-weight:600;font-size:16px}
.btn:disabled{opacity:.45}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.mini svg{width:15px;height:15px}
.mini:disabled{opacity:.4}
.mini.del{color:#ff8a66}
.mini.del.armed{background:var(--again);color:var(--on);border-color:var(--again)}
.mini.on{background:rgba(111,227,160,.14);color:var(--mint);border-color:rgba(111,227,160,.35)}
.mini.primary{background:var(--mint);color:var(--on);border-color:var(--mint)}
.empty{color:var(--muted);text-align:center;padding:32px 10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:5px;border-radius:999px;background:var(--surface);margin-bottom:16px}
.seg button,.seg label{border:0;background:none;text-align:center;padding:9px 4px;border-radius:999px;font-weight:700;font-size:15px;color:var(--muted);position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg [aria-pressed="true"],.seg label:has(input:checked){background:var(--ink);color:var(--on)}
.badge{background:var(--again);color:var(--on);border-radius:999px;font-size:11px;font-weight:800;padding:1px 7px;margin-left:5px;font-variant-numeric:tabular-nums}
.search{width:100%;border:0;border-radius:999px;padding:13px 18px;font-size:16px;background:var(--surface);color:var(--ink)}
.filters{display:flex;gap:6px;margin:12px 0 8px;flex-wrap:wrap}
.filters button,.chips button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600}
.filters button[aria-pressed="true"],.chips button[aria-pressed="true"]{background:var(--yellow);color:var(--on);border-color:var(--yellow)}
.section-title{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}

/* review */
.rhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.progress{font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
.card{border-radius:var(--r-xl);min-height:280px;padding:20px 20px 22px;display:flex;flex-direction:column;gap:12px;color:var(--on);background:var(--sky)}
.card.t-kalip{background:var(--pink)} .card.t-chunk{background:var(--mint)}
.card .tag{background:rgba(0,0,0,.12);color:var(--on)}
.card .round{background:transparent;border-color:rgba(0,0,0,.22);color:var(--on)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.front{font-family:var(--f-display);font-size:clamp(28px,8vw,36px);font-weight:800;line-height:1.05;letter-spacing:-.025em;margin:6px 0 0;overflow-wrap:anywhere}
.ans{font-size:20px;font-weight:700;margin:0;overflow-wrap:anywhere;padding-top:14px;border-top:1.5px solid rgba(0,0,0,.15)}
.note{margin:0;color:var(--on-muted);font-style:italic;white-space:pre-wrap;overflow-wrap:anywhere}
.reveal{margin-top:auto;border:0;border-radius:999px;padding:15px;background:var(--on);color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:17px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.grade{border:0;border-radius:var(--r-md);padding:12px 2px 10px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:15px;color:var(--on)}
.grade small{font-weight:600;font-size:12px;color:var(--on-muted)}
.grade[data-g="0"]{background:var(--red)}.grade[data-g="1"]{background:var(--yellow)}.grade[data-g="2"]{background:var(--mint)}.grade[data-g="3"]{background:var(--lav)}
.hint{color:var(--muted);font-size:13px;text-align:center;margin:12px 0 0}
.done{text-align:center;padding:40px 10px;display:flex;flex-direction:column;align-items:center;gap:12px}
.done h2{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.025em;line-height:1.05;margin:0}
.done p{margin:0;color:var(--muted);max-width:34ch}
.done .row-btns{justify-content:center}

/* tell a friend */
.friend{background:var(--surface);border-radius:var(--r-xl);padding:16px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.friend h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.friend .fh{margin:0;font-size:14px;color:var(--muted)}
.friend .fh b{color:var(--ink)}
.bubbles{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.bubble{max-width:88%;background:var(--blue);color:var(--on);border-radius:20px 20px 6px 20px;padding:9px 14px;font-size:16px;line-height:1.4;overflow-wrap:anywhere;display:flex;gap:8px;align-items:flex-start}
.bubble span{flex:1;min-width:0}
.bubble button{border:0;background:none;padding:2px 0 0;color:var(--on-muted);display:grid;place-items:center;flex:none}
.bubble button svg{width:16px;height:16px}
.bubble-time{font-size:11px;color:var(--faint);margin:-2px 4px 0 0}
.say-row{display:flex;gap:8px;align-items:flex-end}
.say-row textarea{flex:1;min-width:0;border:0;border-radius:20px;background:var(--surface2);color:var(--ink);padding:11px 16px;font-size:16px;line-height:1.4;resize:none;min-height:46px;max-height:160px}
.say-row textarea:focus{outline:2px solid var(--line)}
.send{border:0;width:46px;height:46px;border-radius:999px;background:var(--blue);color:var(--on);display:grid;place-items:center;flex:none;padding:0}
.send svg{width:20px;height:20px}
.send:disabled{opacity:.35}

/* forms */
form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea{width:100%;border:1.5px solid transparent;border-radius:var(--r-md);padding:13px 16px;font-size:17px;background:var(--surface2);color:var(--ink)}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--yellow)}
.panel .seg{background:var(--surface2);margin:0}

/* lists */
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{padding:14px 16px;border-radius:var(--r-lg);background:var(--surface);display:flex;flex-direction:column;gap:3px;min-width:0}
.item .en{font-weight:700;font-size:18px;overflow-wrap:anywhere}
.item .nt{color:var(--muted);font-size:14px;font-style:italic;white-space:pre-wrap;overflow-wrap:anywhere}
.item .said{align-self:flex-start;max-width:100%;margin-top:4px;background:rgba(138,163,242,.16);color:#c7d3ff;border-radius:14px 14px 14px 4px;padding:6px 12px;font-size:14px;overflow-wrap:anywhere}
.item .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}

const prettyDate = k => { const [y, m, d] = k.split("-").map(Number); return d + " " + MONTHS[m - 1] + " " + y; };
function when(t){
  const d = new Date(t), now = Date.now(), diff = now - t;
  const hm = pad(d.getHours()) + ":" + pad(d.getMinutes());
  if (diff < 60000) return "Just now";
  if (dateKey(t) === dateKey(now)) return "Today, " + hm;
  if (dateKey(t) === dateKey(now - DAY)) return "Yesterday, " + hm;

if (!prefs.dir) { try { prefs.dir = localStorage.getItem(KEY + "-dir") || "en"; } catch(e){ prefs.dir = "en"; } }

/* media files live in IndexedDB (photos and videos are too big for normal storage) */
let idb = null;
function openDB(){
  if (idb) return idb;
  idb = new Promise((res, rej) => {
    try {
      const r = indexedDB.open("my-notebook-media", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("media");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch(e){ rej(e); }

}
async function mediaPut(id, blob){ const db = await openDB(); return new Promise((res, rej) => { const tx = db.transaction("media", "readwrite"); tx.objectStore("media").put(blob, id); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); }); }
async function mediaGet(id){ const db = await openDB(); return new Promise((res, rej) => { const r = db.transaction("media").objectStore("media").get(id); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); }); }

let snapT = null;
function queueSnapshot(){ clearTimeout(snapT); snapT = setTimeout(writeSnapshot, 600); }
function writeSnapshot(){
  try {
    const now = Date.now(), prompts = {};
    for (let i = 0; i < 3; i++){ const k = dateKey(now + i * DAY); prompts[k] = promptFor(k); }
    const wc = {}; for (const k in writes){ const n = countWords(writes[k].text || ""); if (n) wc[k] = n; }
    const snap = {
      updatedAt: now,
      cards: cards.map(c => ({ en: c.en, tr: c.tr || "", type: c.type || "kalip", due: c.due || 0, interval: c.interval || 0, chunkId: c.chunkId || null })),
      writes: wc, prompts,
      texts: texts.map(t => ({ id: t.id, title: t.title || "", updatedAt: t.updatedAt || t.createdAt || 0 })),
    };
    const r = indexedDB.open("my-notebook-meta", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => { try { r.result.transaction("kv", "readwrite").objectStore("kv").put(snap, "snapshot"); } catch(e){} };
  } catch(e){}

}
function updateBadge(){
  try {
    if (!navigator.setAppBadge || !("Notification" in window) || Notification.permission !== "granted") return;
    const due = cards.filter(c => (c.due || 0) <= Date.now()).length;

}

async function mediaURL(id){
  if (urlCache.has(id)) return urlCache.get(id);
  try { const b = await mediaGet(id); if (!b) return null; const u = URL.createObjectURL(b); urlCache.set(id, u); return u; } catch(e){ return null; }
}

function pickVoice(){
  if (!voices.length) loadVoices();

  const parts = splitForTts(forSpeech(text));
  if (!parts.length) return Promise.resolve();
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch(e){}
  if (!player){ player = new Audio(); player.preload = "auto"; }
  const a = player, token = ++playToken;
  a.pause();
  return new Promise((resolve, reject) => {
    let i = 0;
    a.onended = () => { if (token !== playToken) return; i++; if (i < parts.length){ a.src = ttsUrl(parts[i]); a.play().catch(reject); } else resolve(); };
    a.onerror = () => { if (token === playToken) reject(new Error("audio")); };
    a.src = ttsUrl(parts[0]);
    const p = a.play(); if (p && p.catch) p.catch(reject);
  });
}
function speak(text){
  if (IS_APP && navigator.onLine !== false){ playAudio(text).catch(() => speakSynth(text)); return; }
  speakSynth(text);
}
function speakSynth(text){
  const synth = window.speechSynthesis;
  if (!synth || typeof SpeechSynthesisUtterance === "undefined"){ toast("This browser can't read aloud. Use the sound button in the dictionary."); return; }
  const say = () => {
    const u = new SpeechSynthesisUtterance(forSpeech(text));
    u.lang = "en-US"; u.rate = 0.9; u.pitch = 1; u.volume = 1;
    const v = pickVoice(); if (v){ u.voice = v; u.lang = v.lang; }
    let started = false;
    u.onstart = () => { started = true; };
    u.onerror = e => { if (e.error !== "interrupted" && e.error !== "canceled") toast("Couldn't play the sound (" + e.error + ")"); };
    synth.speak(u);
    try { if (synth.paused) synth.resume(); } catch(e){}
    setTimeout(() => {
      if (!started && !synth.speaking){
        const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
        toast(ios ? "No sound? Turn off silent mode on the side of your iPhone and turn the volume up." : "No sound? Turn the volume up, or check the text-to-speech engine in Settings.", 4200);
      }
    }, 1800);
  };
  try { if (synth.speaking || synth.pending){ synth.cancel(); setTimeout(say, 150); } else say(); }
  catch(e){ toast("Couldn't play the sound"); }
}

/* ---------------- scheduling ---------------- */
function startOfDay(t){ const d = new Date(t); d.setHours(4, 0, 0, 0); if (d.getTime() > t) d.setDate(d.getDate() - 1); return d.getTime(); }
function schedule(c, g, now){
  let ease = c.ease || 2.5, interval = c.interval || 0, reps = c.reps || 0, lapses = c.lapses || 0;
  if (g === 0) return { ease: Math.max(1.3, ease - 0.2), interval: 0, reps: 0, lapses: lapses + 1, due: now + 10 * 60000, minutes: 10 };
  if (g === 1){ interval = reps === 0 ? 1 : Math.max(interval + 1, Math.round(interval * 1.2)); ease = Math.max(1.3, ease - 0.15); }
  if (g === 2){ interval = reps === 0 ? 1 : reps === 1 ? 3 : Math.max(interval + 1, Math.round(interval * ease)); }
  if (g === 3){ interval = reps === 0 ? 3 : Math.max(interval + 2, Math.round(interval * ease * 1.3)); ease += 0.15; }
  return { ease: Math.round(ease * 100) / 100, interval, reps: reps + 1, lapses, due: startOfDay(now) + interval * DAY };
}
function fmtInterval(s){
  if (s.minutes) return s.minutes + " min";
  const d = s.interval;
  if (d < 30) return plural(d, "day");
  if (d < 365) return Math.round(d / 30) + " mo";
  return Math.round(d / 36.5) / 10 + " yr";
}
function fmtDue(due){
  const now = Date.now();
  if (!due || due <= now) return "due now";
  if (due - now < 3600000) return "in " + Math.ceil((due - now) / 60000) + " min";
  const days = Math.round((startOfDay(due) - startOfDay(now)) / DAY);
  if (days <= 0) return "later today";
  if (days === 1) return "tomorrow";
  if (days < 30) return "in " + days + " days";
  return "in " + plural(Math.round(days / 30), "month");
}

    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);

    }
    out += esc(p.slice(last));
    html += "<p>" + out + "</p>";
  });
  rd = { id, tokens, paras };
  app.innerHTML = bar(t.title || "Text") +
    '<div class="row-btns" style="margin-bottom:14px"><button class="mini" type="button" data-say="' + esc(t.body.slice(0, 3000)) + '">' + I.speak + 'Listen to text</button><button class="mini" type="button" data-go="readedit/' + t.id + '">Edit</button></div>' +
    '<div class="reader" id="reader">' + html + '</div><div class="reader-pad"></div>';
}
function sentenceOf(tok){
  const p = rd.paras[tok.p];
  let a = 0, b = p.length;
  const re = /[.!?]+["'’”)\]]*\s+/g; let m;
  while ((m = re.exec(p))){ const end = m.index + m[0].length; if (end <= tok.s) a = end; else { b = m.index + m[0].trimEnd().length; break; } }
  return p.slice(a, b).trim();
}
function selPhrase(){ return rd.tokens.slice(sel.a, sel.b + 1).map(t => t.w).join(" "); }
function openSheet(){
  document.querySelectorAll(".w.sel").forEach(e => e.classList.remove("sel"));
  for (let i = sel.a; i <= sel.b; i++){ const e = document.querySelector('.w[data-i="' + i + '"]'); if (e) e.classList.add("sel"); }
  const phrase = selPhrase(), ctx = sentenceOf(rd.tokens[sel.a]);
  const exist = cards.find(c => fold(c.en) === fold(phrase));
  let s = $(".sheet");
  const keepTr = s && $("#s-tr") ? $("#s-tr").value : "";
  if (!s){ s = document.createElement("div"); s.className = "sheet"; document.body.appendChild(s); }
  const canPrev = sel.a > 0 && rd.tokens[sel.a - 1].p === rd.tokens[sel.a].p, canNext = sel.b < rd.tokens.length - 1 && rd.tokens[sel.b + 1].p === rd.tokens[sel.b].p;
  s.innerHTML = '<div class="in">' +
    '<div class="top"><span class="phrase">' + esc(phrase) + '</span><button class="round" type="button" data-act="close-sheet" aria-label="Close">' + I.x + '</button></div>' +
    '<div class="row-btns"><button class="mini" type="button" data-act="sel-prev"' + (canPrev ? "" : " disabled") + '>+ previous word</button><button class="mini" type="button" data-act="sel-next"' + (canNext ? "" : " disabled") + '>+ next word</button>' + (sel.b > sel.a ? '<button class="mini" type="button" data-act="sel-one">Single word</button>' : "") + '</div>' +
    '<p class="ctx">' + esc(ctx) + '</p>' +
    '<div class="row-btns"><button class="mini" type="button" data-say="' + esc(phrase) + '">' + I.speak + 'Listen</button><a class="mini" href="' + tureng(phrase) + '" target="_blank" rel="noopener">' + I.book + 'Tureng</a><a class="mini" href="' + cambridge(phrase) + '" target="_blank" rel="noopener">' + I.book + 'Cambridge</a></div>' +
    (exist
      ? '<p class="ctx" style="font-style:normal;color:var(--good)">Already in your notebook' + (exist.tr ? ': ' + esc(exist.tr) : '') + '</p>'
      : '<input id="s-tr" placeholder="Turkish meaning" value="' + esc(keepTr) + '" autocomplete="off"><button class="btn" type="button" data-act="add-word">Add to Words</button>') +
    '</div>';
}
function closeSheet(silent){ const s = $(".sheet"); if (s) s.remove(); sel = null; if (!silent) document.querySelectorAll(".w.sel").forEach(e => e.classList.remove("sel")); }

/* ---------------- writing ---------------- */
let saveT = null;
function renderWriting(){
  const k = dateKey(), w = writes[k] || {}, p = promptFor(k), tr = promptTr(p);
  const n = countWords(w.text || ""), st = streak();
  const past = Object.keys(writes).filter(d => d !== k && countWords(writes[d].text)).sort().reverse();
  app.innerHTML = bar("Writing") +
    '<div class="prompt"><small>Today\'s topic · ' + prettyDate(k) + '</small><b>' + esc(p) + '</b>' + (tr ? '<span class="tr">' + esc(tr) + '</span>' : '') +
      (w.text ? '' : '<div class="row-btns"><button class="mini" type="button" data-act="next-prompt">Another topic</button></div>') + '</div>' +
    '<div class="use">' + todaysChunks(3).map(c => '<span class="tag" title="' + esc(c.tr) + '">' + esc(c.en) + '</span>').join("") + '</div>' +
    '<textarea class="wbox" id="wbox" placeholder="Start writing… 250 words max." spellcheck="true" autocapitalize="sentences">' + esc(w.text || "") + '</textarea>' +
    '<div class="wfoot"><span class="count' + (n >= MAX_WORDS ? " full" : "") + '" id="wcount">' + n + ' / ' + MAX_WORDS + ' words</span>' +
      '<span class="row-btns"><button class="mini" type="button" data-act="copy-writing">Copy</button></span></div>' +
    '<p class="lead" style="font-size:13px;margin-top:10px">Your writing saves automatically. For feedback, tap Copy and paste it to Claude.' + (st ? ' Streak: ' + plural(st, "day") + '.' : '') + '</p>' +
    (past.length ? '<div class="section-title">Your past writing</div><ul class="cats">' + past.map(d => '<li><button type="button" data-go="write/' + d + '"><span class="ct"><b>' + prettyDate(d) + '</b><span>' + plural(countWords(writes[d].text), "word") + ' · ' + esc((writes[d].prompt || "").slice(0, 60)) + '</span></span><span class="chev">' + I.chev + '</span></button></li>').join("") + '</ul>' : "");
}
function trimToMax(text){
  const re = /\S+/g; let m, n = 0, end = text.length;
  while ((m = re.exec(text))){ n++; if (n === MAX_WORDS){ end = m.index + m[0].length; break; } }
  return n >= MAX_WORDS ? text.slice(0, end) : text;
}
function onWritingInput(e){
  const ta = e.target; let text = ta.value;
  if (countWords(text) > MAX_WORDS){ text = trimToMax(text); ta.value = text; toast("You can write up to 250 words"); }
  const n = countWords(text), c = $("#wcount");
  c.textContent = n + " / " + MAX_WORDS + " words"; c.classList.toggle("full", n >= MAX_WORDS);
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    const k = dateKey();
    writes[k] = { text, prompt: promptFor(k), updatedAt: Date.now() };
    if (!text.trim()) delete writes[k];
    saveWrites();
  }, 500);
}
function renderWritePast(k){
  const w = writes[k]; if (!w){ go("writing"); return; }
  app.innerHTML = bar(prettyDate(k)) +
    '<div class="prompt"><small>Topic</small><b>' + esc(w.prompt || "") + '</b></div>' +
    '<div class="past">' + esc(w.text) + '</div>' +
    '<div class="wfoot"><span class="count">' + plural(countWords(w.text), "word") + '</span><span class="row-btns"><button class="mini" type="button" data-act="copy-past" data-id="' + k + '">Copy</button><button class="mini" type="button" data-say="' + esc(w.text) + '">' + I.speak + 'Listen</button></span></div>';
}
async function copyText(text, msg = "Copied"){
  try { await navigator.clipboard.writeText(text); toast(msg, 3000); }
  catch(e){ const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast(msg, 3000); } catch(_){ toast("Couldn't copy. Open \"See what gets copied\" and copy it by hand."); } ta.remove(); }
}

/* ---------------- backup ---------------- */
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
async function exportBackup(){
  const d = new Date(), name = "my-notebook-backup-" + dateKey() + ".json";
  const photos = {};
  for (const n of notes) for (const m of (n.media || [])) if (m.type === "image"){ try { const b = await mediaGet(m.id); if (b) photos[m.id] = await blobToDataURL(b); } catch(e){} }
  const blob = new Blob([JSON.stringify({ app: "kalip-defteri", version: 3, exportedAt: d.toISOString(), cards, texts, writes, notes, photos })], { type: "application/json" });
  try {
    const file = new File([blob], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })){ await navigator.share({ files: [file], title: "My Notebook backup" }); return; }
  } catch(e){ if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
$("#file").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const inc = Array.isArray(data) ? data : data.cards;
    if (!Array.isArray(inc)) throw 0;
    let added = 0;
    for (const c of inc){ if (!c || !c.en) continue; const i = cards.findIndex(x => x.id === c.id); if (i === -1){ cards.push(Object.assign({ id: uid() }, c)); added++; } else cards[i] = c; }
    if (Array.isArray(data.texts)) for (const t of data.texts){ if (t && t.id && !texts.some(x => x.id === t.id)) texts.push(t); }
    if (data.writes && typeof data.writes === "object") for (const k in data.writes){ if (!writes[k]) writes[k] = data.writes[k]; }
    if (Array.isArray(data.notes)){
      for (const n of data.notes){ if (n && n.id && !notes.some(x => x.id === n.id)) notes.push(n); }
      notes.sort((a, b) => b.createdAt - a.createdAt);
      if (data.photos) for (const id in data.photos){ try { const b = await (await fetch(data.photos[id])).blob(); await mediaPut(id, b); } catch(e){} }
    }
    saveCards(); saveTexts(); saveWrites(); saveNotes(); queue = null; render();
    toast(plural(added, "new card") + " restored");
  } catch(err){ toast("That file isn't a My Notebook backup"); }
});

/* ---------------- events ---------------- */
document.addEventListener("click", async e => {
  const t = e.target;
  const sayB = t.closest("[data-say]"); if (sayB){ speak(sayB.dataset.say); return; }
  const goB = t.closest("[data-go]");
  if (goB){
    armed = null; editingNote = null; go(goB.dataset.go); return;
  }
  const wt = t.closest("[data-wt]");
  if (wt){
    armed = null; const tab = wt.dataset.wt;
    if (route === "learn"){ setLearnTab(tab); try { history.replaceState(null, "", "#learn/" + learnTab); } catch(_){} renderLearn(); window.scrollTo(0, 0); }
    else go("learn/" + tab);
    return;
  }
  const wf = t.closest("[data-wf]"); if (wf){ wFilter = wf.dataset.wf; renderWordList(); return; }
  const tp = t.closest("[data-topic]"); if (tp){ prefs.speakTopic = tp.dataset.topic; savePrefs(); renderSpeaking(); return; }
  const lv = t.closest("[data-level]"); if (lv){ prefs.level = lv.dataset.level; savePrefs(); renderSpeaking(); return; }
  const cp = t.closest('[data-act="copy-practice"]');
  if (cp){ copyText(practicePrompt(), "Copied. Paste it into ChatGPT and send."); return; } /* the link itself opens ChatGPT */
  const gb = t.closest(".grade"); if (gb){ grade(+gb.dataset.g); return; }
  const w = t.closest(".w");
  if (w && rd){ const i = +w.dataset.i; sel = { a: i, b: i }; openSheet(); return; }
  const a = t.closest("[data-act]");
  if (!a){ if (armed){ armed = null; if (route === "learn" && learnTab === "list") renderWordList(); else render(); } return; }
  const act = a.dataset.act, id = a.dataset.id;
  switch (act){
    case "reveal": revealed = true; renderReview(); break;
    case "dir": prefs.dir = prefs.dir === "tr" ? "en" : "tr"; savePrefs(); renderReview(); break;
    case "restart": queue = null; renderReview(); break;
    case "edit": openQuickAdd(cards.find(x => x.id === id)); break;
    case "del":
      if (armed !== id){ armed = id; render(); return; }
      armed = null; cards = cards.filter(x => x.id !== id); saveCards(); toast("Deleted"); render(); break;
    case "form-say": { const v = $("#f-en").value.trim(); if (v) speak(v); else toast("Type the English first"); break; }
    case "form-dict": { const v = $("#f-en").value.trim(); if (v) window.open(tureng(v), "_blank", "noopener"); else toast("Type the English first"); break; }
    case "toggle-chunk": openChunks.has(id) ? openChunks.delete(id) : openChunks.add(id); render(); break;
    case "review-chunk": addChunkToReview(id); saveCards(); toast("Added to review"); render(); break;
    case "unreview-chunk": cards = cards.filter(c => c.chunkId !== id); saveCards(); toast("Removed from review"); render(); break;
    case "review-cat": {
      if (armed !== "cat" + id){ armed = "cat" + id; render(); return; }
      armed = null; const c = DATA.categories.find(x => String(x.id) === id); let n = 0;
      c.items.forEach(i => { if (!chunkCard(i.id)){ addChunkToReview(i.id); n++; } }); saveCards(); toast(plural(n, "chunk") + " added to review"); render(); break;
    }
    case "toggle-group": openGroup = openGroup === +id ? null : +id; render(); break;
    case "del-text":
      if (armed !== "t" + id){ armed = "t" + id; render(); return; }
      armed = null; texts = texts.filter(x => x.id !== id); saveTexts(); toast("Text deleted"); go("reading"); break;
    case "close-sheet": closeSheet(); break;
    case "sel-prev": sel.a--; openSheet(); break;
    case "sel-next": sel.b++; openSheet(); break;
    case "sel-one": sel.b = sel.a; openSheet(); break;
    case "add-word": {
      const phrase = selPhrase(), tr = ($("#s-tr").value || "").trim();
      const multi = sel.b > sel.a;
      cards.push(newCard({ en: multi ? phrase : phrase.toLowerCase().replace(/^i$/, "I"), tr, note: sentenceOf(rd.tokens[sel.a]), type: multi ? "kalip" : "kelime" }));
      saveCards();
      const txt = texts.find(x => x.id === rd.id); if (txt){ txt.added = (txt.added || 0) + 1; saveTexts(); }
      if (!multi) document.querySelectorAll(".w").forEach(el => { if (fold(el.textContent) === fold(phrase)) el.classList.add("known"); });
      toast(tr ? "Added to Words" : "Added. You can fill in the Turkish meaning later in Words.");
      closeSheet(); break;
    }
    case "next-prompt": { const k = dateKey(); prefs.promptOffset = { [k]: ((prefs.promptOffset && prefs.promptOffset[k]) || 0) + 1 }; savePrefs(); renderWriting(); break; }
    case "copy-writing": { const v = $("#wbox").value.trim(); if (!v) return toast("You haven't written anything yet"); copyText("Today's topic: " + promptFor(dateKey()) + "\n\n" + v); break; }
    case "copy-past": copyText("Topic: " + (writes[id].prompt || "") + "\n\n" + writes[id].text); break;
    case "push-on": enablePush(); break;
    case "push-off": disablePush(); break;
    case "push-copy": copyText(prefs.pushSetup || "", "Setup code copied. Paste it into SETUP_CODE in Cloudflare."); break;
    case "push-sample": samplePush(+id); break;
    case "copy-practice-only": copyText(practicePrompt(), "Copied. Paste it into ChatGPT and send."); break;
    case "export": exportBackup(); break;
    case "import": $("#file").click(); break;
    case "pick-photo": $("#pick-photo").click(); break;
    case "rm-draft": { const m = draft.media.splice(+id, 1)[0]; if (m) URL.revokeObjectURL(m.url); hydrateComposer(); break; }
    case "post": postNote(); break;
    case "think": openThink(); break;
    case "quick-add": openQuickAdd(); break;
    case "close-overlay": closeOverlay(); break;
    case "say-send": { const c = current(), ta = $("#say"); if (c && ta && ta.value.trim()){ addSaid(c, ta.value.trim()); toast("Saved"); renderReview(); } break; }
    case "view": { const u = await mediaURL(id); if (u) openViewer(u); break; }
    case "close-viewer": closeViewer(); break;
    case "edit-note": editingNote = id; armed = null; render(); { const ta = $("#ne-" + id); if (ta){ ta.focus(); } } break;
    case "cancel-note": editingNote = null; render(); break;
    case "save-note": {
      const n = notes.find(x => x.id === id), v = $("#ne-" + id).value.trim();
      if (n){ if (!v && !(n.media || []).length){ toast("A note can't be empty"); return; } n.text = v; n.editedAt = Date.now(); saveNotes(); }
      editingNote = null; toast("Saved"); render(); break;
    }
    case "del-note": {
      if (armed !== "n" + id){ armed = "n" + id; render(); return; }
      armed = null; const n = notes.find(x => x.id === id);
      notes = notes.filter(x => x.id !== id); saveNotes();
      if (n) for (const m of (n.media || [])){ const u = urlCache.get(m.id); if (u){ URL.revokeObjectURL(u); urlCache.delete(m.id); } mediaDel(m.id); }
      toast("Note deleted"); render(); break;
    }
  }
});
document.addEventListener("click", e => { if (e.target.classList && e.target.classList.contains("viewer")) closeViewer(); if (e.target.classList && e.target.classList.contains("overlay")) closeOverlay(); });
document.addEventListener("keydown", e => { if (e.key === "Escape"){ closeOverlay(); closeViewer(); } });
$("#pick-photo").addEventListener("change", e => { const f = [...e.target.files]; e.target.value = ""; addFiles(f); });
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "qa"){
    const v = readCardForm(e.target); if (!v) return;
    if (editing){ const c = cards.find(x => x.id === editing); if (c) Object.assign(c, v); saveCards(); editing = null; closeOverlay(); toast("Saved"); render(); }
    else if (addLearned(v)){ closeOverlay(); toast("Added. You'll see it in your review."); render(); }
  }
  if (e.target.id === "tf"){
    const title = $("#t-title").value.trim(), body = $("#t-body").value.trim(), id = $("#t-id").value;
    if (!body){ toast("Paste the text first"); return; }
    if (id){ const t = texts.find(x => x.id === id); Object.assign(t, { title, body, updatedAt: Date.now() }); saveTexts(); go("read/" + id); }
    else { const t = { id: uid(), title, body, createdAt: Date.now(), updatedAt: Date.now(), added: 0 }; texts.push(t); saveTexts(); go("read/" + t.id); }
  }
});
let draftT = null;
document.addEventListener("input", e => {
  if (e.target.id === "wq"){ wQuery = e.target.value; const p = e.target.selectionStart; renderWordList(); const q = $("#wq"); q.focus(); try { q.setSelectionRange(p, p); } catch(_){} }
  if (e.target.id === "wbox") onWritingInput(e);
  if (e.target.id === "say"){ const c = current(); if (c) sayDrafts[c.id] = e.target.value; autoGrow(e.target); const b = $('[data-act="say-send"]'); if (b) b.disabled = !e.target.value.trim(); }
  if (e.target.id === "nt"){
    draft.text = e.target.value; autoGrow(e.target);
    const p = $("#npost"); if (p) p.disabled = !canPost();
    clearTimeout(draftT); draftT = setTimeout(() => write(KEY + "-draft", draft.text), 400);
  }
});
document.addEventListener("keydown", e => {
  if (route !== "learn" || learnTab !== "review" || $(".overlay") || e.target.closest("input,textarea")) return;
  if (!revealed && (e.key === " " || e.key === "Enter") && current()){ e.preventDefault(); revealed = true; renderReview(); }
  else if (revealed && /^[1-4]$/.test(e.key)) grade(+e.key - 1);
});
/* if iPhone ever renews the notification address, keep the setup code current and say so */
async function checkSubscription(){
  if (!pushOn()) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToBytes(VAPID_PUBLIC) });
    const old = JSON.parse(prefs.pushSetup);
    if (old.subscription.endpoint !== sub.endpoint){
      prefs.pushSetup = JSON.stringify({ subscription: sub.toJSON(), app: location.origin + location.pathname }); savePrefs();
      toast("Notification setup changed. Open Notifications and copy the setup code to Cloudflare again.", 6000);
    }
  } catch(e){}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") updateBadge();
  if (document.visibilityState === "visible" && route === "learn" && learnTab === "review" && !revealed){ if (queue && !current()) queue = null; render(); }
});

parseHash(); render(); writeSnapshot(); checkSubscription();
if ("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(() => {});
  navigator.serviceWorker.addEventListener("message", e => { if (e.data && "go" in e.data) go(e.data.go); });
}
})();
